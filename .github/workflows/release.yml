# Publie une release GitHub avec index.html en téléchargement et les notes
# de la section correspondante du CHANGELOG.
# Deux déclenchements possibles :
#   - pousser un tag vX.Y.Z ;
#   - lancer le workflow à la main (onglet Actions → Release → Run workflow) avec la version X.Y.Z :
#     le tag est alors créé sur le commit choisi.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      - name: Vérifier que la version de l'application correspond
        run: |
          grep -q "const VERSION = '${VERSION}';" index.html \
            || { echo "::error::index.html ne déclare pas VERSION = '${VERSION}'"; exit 1; }

      - name: Extraire les notes du CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::Aucune section ${VERSION} dans CHANGELOG.md"; exit 1; }
          {
            echo
            echo "---"
            echo "**Utilisation** : téléchargez \`index.html\` ci-dessous et ouvrez-le dans votre navigateur."
            echo "Un problème, une idée ? [Ouvrez une issue](https://github.com/${GITHUB_REPOSITORY}/issues/new/choose)."
          } >> notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.html "bomarkdown-studio-${TAG}.html"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "BoMarkdown Studio ${TAG}" \
            --notes-file notes.md \
            index.html "bomarkdown-studio-${TAG}.html"
